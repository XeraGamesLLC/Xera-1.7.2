<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Magic 8 Ball - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
    #ball {
        width: 220px;
        height: 220px;
        margin: 20px auto;
        border-radius: 50%;
        background-color: #14141c;
        border: 6px solid rgba(255,255,255,0.3);
        -webkit-box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
        box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
        text-align: center;
        position: relative;
    }
    #ball.shake { -webkit-animation: sh 0.4s; }
    @-webkit-keyframes sh {
        0% { -webkit-transform: rotate(0deg); }
        25% { -webkit-transform: rotate(-8deg); }
        50% { -webkit-transform: rotate(8deg); }
        75% { -webkit-transform: rotate(-6deg); }
        100% { -webkit-transform: rotate(0deg); }
    }
    #window {
        width: 130px;
        height: 130px;
        margin: 45px auto 0 auto;
        border-radius: 50%;
        background-color: #1a2a6c;
        color: #fff;
        font-size: 15px;
        font-weight: bold;
        line-height: 1.3;
        display: table;
    }
    #window span {
        display: table-cell;
        vertical-align: middle;
        padding: 12px;
    }
</style>
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Magic 8 Ball</h1></div>

    <div id="ball">
        <div id="window"><span id="answer">Ask a question and tap the ball</span></div>
    </div>

    <div class="footer-note">Tap the ball for your answer</div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var answers = [
        'It is certain', 'Without a doubt', 'Yes definitely', 'You may rely on it',
        'As I see it, yes', 'Most likely', 'Outlook good', 'Yes',
        'Signs point to yes', 'Reply hazy, try again', 'Ask again later',
        'Better not tell you now', 'Cannot predict now', 'Concentrate and ask again',
        "Don't count on it", 'My reply is no', 'My sources say no',
        'Outlook not so good', 'Very doubtful'
    ];

    var ball = $('ball');
    var answerEl = $('answer');
    var busy = false;

    on(ball, 'touchstart', function (e) {
        e.preventDefault();
        if (busy) { return; }
        busy = true;
        ball.className = 'shake';
        answerEl.innerHTML = '...';
        setTimeout(function () {
            ball.className = '';
            answerEl.innerHTML = answers[Math.floor(Math.random() * answers.length)];
            busy = false;
        }, 500);
    });
})();
</script>
</body>
</html>
