<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Starfield - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Starfield</h1></div>

    <canvas id="stars" width="290" height="360"></canvas>

    <div class="btn-row">
        <span class="btn" id="speedbtn">Speed: Normal</span>
        <span class="btn" id="colorbtn">Colors: White</span>
    </div>
    <div class="footer-note">Tap the board to boost</div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var canvas = $('stars');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var cx = W / 2, cy = H / 2;
    var count = 140;
    var stars = [];
    var speed = 2;
    var speeds = [1, 2, 4];
    var speedNames = ['Slow', 'Normal', 'Fast'];
    var speedIdx = 1;
    var boost = 0;
    var palettes = [
        { name: 'White', colors: ['#ffffff'] },
        { name: 'Rainbow', colors: ['#ff5f6d', '#ffb347', '#ffd23f', '#9dffb0', '#7fd8ff', '#c956b0'] },
        { name: 'Ice', colors: ['#bfefff', '#7fd8ff', '#ffffff'] }
    ];
    var paletteIdx = 0;

    lockScroll(canvas);

    function makeStar() {
        return {
            x: (Math.random() - 0.5) * W,
            y: (Math.random() - 0.5) * H,
            z: Math.random() * W,
            c: palettes[paletteIdx].colors[Math.floor(Math.random() * palettes[paletteIdx].colors.length)]
        };
    }

    for (var i = 0; i < count; i++) {
        stars.push(makeStar());
    }

    function step() {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(0, 0, W, H);

        var vel = speeds[speedIdx] + boost;
        if (boost > 0) { boost -= 0.3; }

        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.z -= vel;
            if (s.z <= 1) {
                var ns = makeStar();
                ns.z = W;
                stars[i] = ns;
                continue;
            }
            var k = 128 / s.z;
            var px = cx + s.x * k;
            var py = cy + s.y * k;

            if (px < 0 || px >= W || py < 0 || py >= H) {
                stars[i] = makeStar();
                continue;
            }

            var size = (1 - s.z / W) * 3 + 0.5;
            ctx.fillStyle = s.c;
            ctx.fillRect(px, py, size, size);
        }

        setTimeout(step, 33);
    }

    on(canvas, 'touchstart', function () {
        boost = 10;
    });

    onTap($('speedbtn'), function () {
        speedIdx = (speedIdx + 1) % speeds.length;
        $('speedbtn').innerHTML = 'Speed: ' + speedNames[speedIdx];
    });

    onTap($('colorbtn'), function () {
        paletteIdx = (paletteIdx + 1) % palettes.length;
        $('colorbtn').innerHTML = 'Colors: ' + palettes[paletteIdx].name;
    });

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    step();
})();
</script>
</body>
</html>
