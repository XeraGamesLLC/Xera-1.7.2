services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xra_dev_password}
      POSTGRES_DB: xra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgresql://xra:${POSTGRES_PASSWORD:-xra_dev_password}@postgres:5432/xra?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a long random secret in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a different long random secret in .env}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      UPLOAD_DIR: /app/uploads
      MAX_AVATAR_SIZE_MB: 8
      MAX_ATTACHMENT_SIZE_MB: 25
      ANTI_VPN_ENABLED: ${ANTI_VPN_ENABLED:-false}
      ANTI_VPN_API_KEY: ${ANTI_VPN_API_KEY:-}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    volumes:
      - uploads:/app/uploads
    # No published port — the backend is only reachable through the frontend
    # container's nginx (which proxies /api and /socket.io to it) and that,
    # in turn, only through Caddy's TLS. Nothing unencrypted is exposed to
    # the internet.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No published port either — see caddy below, which is the only
    # container with anything exposed to the internet.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      # A real, publicly-resolvable hostname is required for Caddy to get a
      # trusted Let's Encrypt cert — an IP literal won't work. Defaults to a
      # free sslip.io hostname that resolves straight back to this VPS, so
      # this works out of the box with zero domain setup; set to a real
      # domain in .env once you have one.
      XRA_DOMAIN: ${XRA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
