<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Flappy - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Flappy</h1></div>

    <div class="panel">
        <span class="stat">Score: <b id="score">0</b> &nbsp;&nbsp; Best: <b id="best">0</b></span>
    </div>

    <canvas id="game" width="280" height="380"></canvas>

    <div class="btn-row"><span class="btn" id="restart">Restart</span></div>
    <div class="footer-note">Tap the board to flap</div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var canvas = $('game');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var gravity = 0.35, flap = -6.2;
    var birdX = 60, birdY, birdV, score, best, alive, pipes, timer, frame;
    var gap = 120, pipeW = 40, pipeSpeed = 2.2;

    lockScroll(canvas);

    function reset() {
        birdY = H / 2;
        birdV = 0;
        score = 0;
        alive = true;
        frame = 0;
        best = Store.get('flappy_best', 0);
        $('score').innerHTML = '0';
        $('best').innerHTML = String(best);
        pipes = [];
        addPipe();
        if (timer) { clearInterval(timer); }
        timer = setInterval(step, 20);
    }

    function addPipe() {
        var topH = 40 + Math.random() * (H - gap - 120);
        pipes.push({ x: W, top: topH, passed: false });
    }

    function doFlap() {
        if (!alive) { return; }
        birdV = flap;
    }

    on(canvas, 'touchstart', doFlap);

    function step() {
        if (!alive) { return; }
        frame += 1;

        birdV += gravity;
        birdY += birdV;

        if (birdY < 0) { birdY = 0; birdV = 0; }
        if (birdY > H) { gameOver(); return; }

        for (var i = 0; i < pipes.length; i++) {
            pipes[i].x -= pipeSpeed;
        }
        if (pipes.length && pipes[0].x < -pipeW) {
            pipes.shift();
        }
        if (frame % 90 === 0) {
            addPipe();
        }

        for (i = 0; i < pipes.length; i++) {
            var p = pipes[i];
            if (birdX + 10 > p.x && birdX - 10 < p.x + pipeW) {
                if (birdY - 10 < p.top || birdY + 10 > p.top + gap) {
                    gameOver();
                    return;
                }
            }
            if (!p.passed && p.x + pipeW < birdX) {
                p.passed = true;
                score += 1;
                $('score').innerHTML = String(score);
            }
        }

        draw();
    }

    function gameOver() {
        alive = false;
        clearInterval(timer);
        if (score > best) {
            best = score;
            Store.set('flappy_best', best);
            $('best').innerHTML = String(best);
        }
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Helvetica';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', W / 2, H / 2 - 6);
        ctx.font = '14px Helvetica';
        ctx.fillText('Tap Restart', W / 2, H / 2 + 18);
    }

    function draw() {
        ctx.fillStyle = '#0d0d1a';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#4dd672';
        for (var i = 0; i < pipes.length; i++) {
            var p = pipes[i];
            ctx.fillRect(p.x, 0, pipeW, p.top);
            ctx.fillRect(p.x, p.top + gap, pipeW, H - p.top - gap);
        }

        ctx.fillStyle = '#ffd23f';
        ctx.beginPath();
        ctx.arc(birdX, birdY, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    onTap($('restart'), reset);

    reset();
})();
</script>
</body>
</html>
