<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Word Scramble - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
    #scrambled {
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 4px;
        text-align: center;
        margin: 16px 0;
    }
    #guess {
        width: 100%;
        font-size: 18px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.4);
        background-color: rgba(255,255,255,0.12);
        color: #fff;
        text-align: center;
    }
</style>
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Word Scramble</h1></div>

    <div class="panel">
        <span class="stat">Score: <b id="score">0</b></span>
    </div>

    <div id="scrambled">-</div>
    <input type="text" id="guess" autocapitalize="off" autocorrect="off" placeholder="Type your guess" />

    <div class="btn-row">
        <span class="btn" id="submit">Submit</span>
        <span class="btn" id="hint">Hint</span>
        <span class="btn" id="skip">Skip</span>
    </div>
    <div id="msg" class="footer-note"></div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var words = [
        'PIZZA', 'ROCKET', 'GUITAR', 'PUZZLE', 'CASTLE', 'DRAGON', 'PLANET', 'WIZARD',
        'CAMERA', 'PENCIL', 'JUNGLE', 'ISLAND', 'BREEZE', 'CANDLE', 'BASKET', 'MARBLE',
        'TURTLE', 'WINDOW', 'BUTTON', 'GARDEN', 'PIRATE', 'SPIDER', 'THUNDER', 'RAINBOW',
        'MONSTER', 'PANCAKE', 'CACTUS', 'VOLCANO', 'PENGUIN', 'JACKPOT'
    ];
    var current, scrambledWord, score, hintsUsed;

    function shuffleWord(w) {
        var arr = w.split('');
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
        }
        var joined = arr.join('');
        if (joined === w && w.length > 1) { return shuffleWord(w); }
        return joined;
    }

    function newWord() {
        current = words[Math.floor(Math.random() * words.length)];
        scrambledWord = shuffleWord(current);
        hintsUsed = 0;
        $('scrambled').innerHTML = scrambledWord;
        $('guess').value = '';
        $('msg').innerHTML = '';
    }

    function submitGuess() {
        var g = $('guess').value.replace(/^\s+|\s+$/g, '').toUpperCase();
        if (!g) { return; }
        if (g === current) {
            score += 1;
            $('score').innerHTML = String(score);
            $('msg').innerHTML = 'Correct! It was ' + current;
            setTimeout(newWord, 900);
        } else {
            $('msg').innerHTML = 'Not quite - try again';
        }
    }

    onTap($('submit'), submitGuess);
    onTap($('skip'), function () {
        $('msg').innerHTML = 'It was ' + current;
        setTimeout(newWord, 700);
    });
    onTap($('hint'), function () {
        hintsUsed += 1;
        if (hintsUsed >= current.length) {
            $('msg').innerHTML = 'Answer: ' + current;
            return;
        }
        $('msg').innerHTML = 'Starts with: ' + current.substring(0, hintsUsed + 1);
    });

    score = 0;
    newWord();
})();
</script>
</body>
</html>
