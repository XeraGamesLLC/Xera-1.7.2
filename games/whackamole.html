<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Whack-a-Mole - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
    #board {
        width: 264px;
        margin: 10px auto;
        overflow: hidden;
    }
    .hole {
        float: left;
        width: 80px;
        height: 80px;
        margin: 4px;
        border-radius: 50%;
        background-color: #1a1030;
        border: 3px solid rgba(255,255,255,0.35);
        text-align: center;
        line-height: 80px;
        font-size: 40px;
    }
    .hole.up { background-color: #3a2a5a; }
</style>
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Whack-a-Mole</h1></div>

    <div class="panel">
        <span class="stat">Score: <b id="score">0</b> &nbsp;&nbsp; Time: <b id="time">30</b> &nbsp;&nbsp; Best: <b id="best">0</b></span>
    </div>

    <div id="board"></div>

    <div class="btn-row"><span class="btn" id="restart">Start</span></div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var holeCount = 9;
    var holes = [];
    var score, timeLeft, best, popTimer, countTimer, running, activeHole;

    var boardEl = $('board');
    for (var i = 0; i < holeCount; i++) {
        var div = document.createElement('div');
        div.className = 'hole';
        div.id = 'h' + i;
        boardEl.appendChild(div);
        holes.push(div);

        (function (idx) {
            onTap(div, function () { whack(idx); });
        })(i);
    }

    function whack(idx) {
        if (!running) { return; }
        if (idx === activeHole) {
            score += 1;
            $('score').innerHTML = String(score);
            holes[idx].className = 'hole';
            holes[idx].innerHTML = '';
            activeHole = -1;
        }
    }

    function popRandom() {
        if (!running) { return; }
        if (activeHole >= 0) {
            holes[activeHole].className = 'hole';
            holes[activeHole].innerHTML = '';
        }
        activeHole = Math.floor(Math.random() * holeCount);
        holes[activeHole].className = 'hole up';
        holes[activeHole].innerHTML = '&#128027;';

        var delay = 500 + Math.random() * 500;
        popTimer = setTimeout(popRandom, delay);
    }

    function tickTime() {
        timeLeft -= 1;
        $('time').innerHTML = String(timeLeft);
        if (timeLeft <= 0) {
            endGame();
        }
    }

    function endGame() {
        running = false;
        clearTimeout(popTimer);
        clearInterval(countTimer);
        if (activeHole >= 0) {
            holes[activeHole].className = 'hole';
            holes[activeHole].innerHTML = '';
        }
        if (score > best) {
            best = score;
            Store.set('mole_best', best);
            $('best').innerHTML = String(best);
        }
        $('restart').innerHTML = 'Play Again';
    }

    function start() {
        score = 0;
        timeLeft = 30;
        activeHole = -1;
        running = true;
        best = Store.get('mole_best', 0);
        $('score').innerHTML = '0';
        $('time').innerHTML = '30';
        $('best').innerHTML = String(best);
        $('restart').innerHTML = 'Restart';
        for (var i = 0; i < holeCount; i++) {
            holes[i].className = 'hole';
            holes[i].innerHTML = '';
        }
        if (popTimer) { clearTimeout(popTimer); }
        if (countTimer) { clearInterval(countTimer); }
        popRandom();
        countTimer = setInterval(tickTime, 1000);
    }

    onTap($('restart'), start);

    best = Store.get('mole_best', 0);
    $('best').innerHTML = String(best);
})();
</script>
</body>
</html>
