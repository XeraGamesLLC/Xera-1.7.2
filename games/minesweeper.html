<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Minesweeper - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
    #board {
        width: 256px;
        margin: 10px auto;
        overflow: hidden;
        background-color: rgba(0,0,0,0.3);
        border-radius: 8px;
        padding: 4px;
    }
    .msq {
        float: left;
        width: 28px;
        height: 28px;
        margin: 1px;
        line-height: 28px;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        border-radius: 4px;
        background-color: rgba(255,255,255,0.2);
    }
    .msq.open { background-color: rgba(0,0,0,0.25); }
    .msq.mine { background-color: #ff5f6d; }
    .n1 { color: #7fd8ff; }
    .n2 { color: #9dffb0; }
    .n3 { color: #ff9f9f; }
    .n4 { color: #c9a8ff; }
    .n5 { color: #ffd23f; }
    .n6 { color: #7fffd4; }
</style>
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Minesweeper</h1></div>

    <div class="panel">
        <span class="stat">Mines: <b id="mineleft">12</b></span>
        <div id="msg" style="margin-top:4px; font-size:14px;"></div>
    </div>

    <div id="board"></div>

    <div class="btn-row"><span class="btn" id="restart">New Game</span></div>
    <div class="footer-note">Tap to reveal &middot; hold to flag</div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var cols = 8, rows = 10, mineCount = 12;
    var cells, over;
    var boardEl = $('board');

    function idx(r, c) { return r * cols + c; }

    function neighbors(r, c) {
        var out = [];
        for (var dr = -1; dr <= 1; dr++) {
            for (var dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) { continue; }
                var nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                    out.push({ r: nr, c: nc });
                }
            }
        }
        return out;
    }

    function build() {
        cells = [];
        boardEl.innerHTML = '';
        over = false;
        $('msg').innerHTML = '';
        $('mineleft').innerHTML = String(mineCount);

        var total = rows * cols;
        var mineIdx = {};
        while (Object.keys(mineIdx).length < mineCount) {
            mineIdx[Math.floor(Math.random() * total)] = true;
        }

        for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
                var i = idx(r, c);
                var div = document.createElement('div');
                div.className = 'msq';
                div.id = 'msq' + i;
                boardEl.appendChild(div);
                cells.push({ mine: !!mineIdx[i], revealed: false, flagged: false, el: div, r: r, c: c, adj: 0 });
            }
        }

        for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
                var cell = cells[idx(r, c)];
                if (cell.mine) { continue; }
                var n = neighbors(r, c);
                var count = 0;
                for (var k = 0; k < n.length; k++) {
                    if (cells[idx(n[k].r, n[k].c)].mine) { count++; }
                }
                cell.adj = count;
            }
        }

        for (var i2 = 0; i2 < cells.length; i2++) {
            attachHandlers(cells[i2]);
        }
    }

    function reveal(cell) {
        if (cell.revealed || cell.flagged || over) { return; }
        cell.revealed = true;
        cell.el.className = 'msq open';

        if (cell.mine) {
            cell.el.className = 'msq mine';
            cell.el.innerHTML = '&#128163;';
            endGame(false);
            return;
        }

        if (cell.adj > 0) {
            cell.el.innerHTML = String(cell.adj);
            cell.el.className = 'msq open n' + cell.adj;
        } else {
            var n = neighbors(cell.r, cell.c);
            for (var k = 0; k < n.length; k++) {
                reveal(cells[idx(n[k].r, n[k].c)]);
            }
        }
        checkWin();
    }

    function toggleFlag(cell) {
        if (cell.revealed || over) { return; }
        cell.flagged = !cell.flagged;
        cell.el.innerHTML = cell.flagged ? '&#127937;' : '';
        var left = mineCount;
        for (var i = 0; i < cells.length; i++) {
            if (cells[i].flagged) { left--; }
        }
        $('mineleft').innerHTML = String(left);
    }

    function checkWin() {
        var safe = 0;
        for (var i = 0; i < cells.length; i++) {
            if (!cells[i].mine && cells[i].revealed) { safe++; }
        }
        if (safe === rows * cols - mineCount) {
            endGame(true);
        }
    }

    function endGame(won) {
        over = true;
        $('msg').innerHTML = won ? 'You cleared the field!' : 'Boom - game over';
        for (var i = 0; i < cells.length; i++) {
            if (cells[i].mine && !cells[i].revealed) {
                cells[i].el.innerHTML = '&#128163;';
            }
        }
    }

    function attachHandlers(cell) {
        var timer = null;
        var longPressed = false;

        on(cell.el, 'touchstart', function (e) {
            longPressed = false;
            timer = setTimeout(function () {
                longPressed = true;
                toggleFlag(cell);
            }, 450);
        });

        on(cell.el, 'touchend', function (e) {
            e.preventDefault();
            if (timer) { clearTimeout(timer); }
            if (!longPressed) {
                reveal(cell);
            }
        });

        on(cell.el, 'touchmove', function () {
            if (timer) { clearTimeout(timer); }
        });
    }

    onTap($('restart'), build);
    build();
})();
</script>
</body>
</html>
