<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Snake - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
    #dpad { width: 190px; margin: 14px auto 0 auto; }
    #dpad table { width: 100%; border-collapse: collapse; }
    #dpad td { padding: 4px; text-align: center; }
    .dbtn {
        display: block;
        width: 56px;
        height: 56px;
        line-height: 56px;
        margin: 0 auto;
        font-size: 24px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.4);
        background-color: rgba(255,255,255,0.15);
    }
    .dbtn:active { background-color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Snake</h1></div>

    <div class="panel">
        <span class="stat">Score: <b id="score">0</b> &nbsp;&nbsp; Best: <b id="best">0</b></span>
    </div>

    <canvas id="game" width="280" height="280"></canvas>

    <div id="dpad">
        <table>
            <tr><td></td><td><span class="dbtn" id="btn-up">&#9650;</span></td><td></td></tr>
            <tr><td><span class="dbtn" id="btn-left">&#9664;</span></td><td></td><td><span class="dbtn" id="btn-right">&#9654;</span></td></tr>
            <tr><td></td><td><span class="dbtn" id="btn-down">&#9660;</span></td><td></td></tr>
        </table>
    </div>

    <div class="btn-row"><span class="btn" id="restart">Restart</span></div>
    <div class="footer-note">Swipe on the board or use the arrows</div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var canvas = $('game');
    var ctx = canvas.getContext('2d');
    var cell = 14;
    var cols = 20, rows = 20;
    var snake, dir, nextDir, food, score, best, alive, timer;

    lockScroll(canvas);

    function randCell() {
        return Math.floor(Math.random() * cols);
    }

    function placeFood() {
        var ok = false;
        while (!ok) {
            food = { x: randCell(), y: randCell() };
            ok = true;
            for (var i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    ok = false;
                    break;
                }
            }
        }
    }

    function reset() {
        snake = [
            { x: 9, y: 10 },
            { x: 8, y: 10 },
            { x: 7, y: 10 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        alive = true;
        best = Store.get('snake_highscore', 0);
        $('score').innerHTML = '0';
        $('best').innerHTML = String(best);
        placeFood();
        draw();
        if (timer) {
            clearInterval(timer);
        }
        timer = setInterval(tick, 150);
    }

    function setDir(x, y) {
        if (dir.x === -x && dir.y === -y) {
            return;
        }
        nextDir = { x: x, y: y };
    }

    function tick() {
        if (!alive) {
            return;
        }
        dir = nextDir;
        var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows) {
            gameOver();
            return;
        }
        for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 1;
            $('score').innerHTML = String(score);
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function gameOver() {
        alive = false;
        clearInterval(timer);
        if (score > best) {
            best = score;
            Store.set('snake_highscore', best);
            $('best').innerHTML = String(best);
        }
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Helvetica';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 6);
        ctx.font = '14px Helvetica';
        ctx.fillText('Tap Restart', canvas.width / 2, canvas.height / 2 + 18);
    }

    function draw() {
        ctx.fillStyle = '#0d0d1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff5f6d';
        ctx.fillRect(food.x * cell + 1, food.y * cell + 1, cell - 2, cell - 2);

        for (var i = 0; i < snake.length; i++) {
            ctx.fillStyle = i === 0 ? '#9dffb0' : '#4dd672';
            ctx.fillRect(snake[i].x * cell + 1, snake[i].y * cell + 1, cell - 2, cell - 2);
        }
    }

    attachSwipe(canvas, function (direction) {
        if (direction === 'up') { setDir(0, -1); }
        else if (direction === 'down') { setDir(0, 1); }
        else if (direction === 'left') { setDir(-1, 0); }
        else if (direction === 'right') { setDir(1, 0); }
    });

    onTap($('btn-up'), function () { setDir(0, -1); });
    onTap($('btn-down'), function () { setDir(0, 1); });
    onTap($('btn-left'), function () { setDir(-1, 0); });
    onTap($('btn-right'), function () { setDir(1, 0); });
    onTap($('restart'), reset);

    reset();
})();
</script>
</body>
</html>
