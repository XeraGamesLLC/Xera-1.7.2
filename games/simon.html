<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Simon Says - Pocket Arcade</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
    #pads {
        width: 240px;
        height: 240px;
        margin: 14px auto;
        overflow: hidden;
        border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.3);
    }
    .pad {
        float: left;
        width: 118px;
        height: 118px;
        opacity: 0.55;
    }
    .pad.active { opacity: 1; }
    #p0 { background-color: #ff5f6d; border-radius: 100% 0 0 0; }
    #p1 { background-color: #ffd23f; border-radius: 0 100% 0 0; }
    #p2 { background-color: #7fd8ff; border-radius: 0 0 0 100%; }
    #p3 { background-color: #9dffb0; border-radius: 0 0 100% 0; }
</style>
</head>
<body>
<div class="backbar"><a href="../index.html">&larr; Arcade</a></div>
<div class="wrap">
    <div class="header"><h1>Simon Says</h1></div>

    <div class="panel">
        <span class="stat">Round: <b id="round">0</b> &nbsp;&nbsp; Best: <b id="best">0</b></span>
        <div id="msg" style="margin-top:4px; font-size:14px;">Tap Start</div>
    </div>

    <div id="pads">
        <div class="pad" id="p0"></div><div class="pad" id="p1"></div>
        <div class="pad" id="p2"></div><div class="pad" id="p3"></div>
    </div>

    <div class="btn-row"><span class="btn" id="startbtn">Start</span></div>
</div>

<script src="../js/common.js"></script>
<script>
(function () {
    var freqs = [261.6, 329.6, 392.0, 523.2];
    var AC = window.AudioContext || window.webkitAudioContext;
    var actx = AC ? new AC() : null;

    function beep(i) {
        if (!actx) { return; }
        try {
            var osc = actx.createOscillator();
            var gain = actx.createGain();
            osc.frequency.value = freqs[i];
            osc.connect(gain);
            gain.connect(actx.destination);
            gain.gain.setValueAtTime(0.2, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
            osc.start(0);
            osc.stop(actx.currentTime + 0.3);
        } catch (e) {}
    }

    var sequence, playerStep, round, best, accepting, busy;

    function flash(i, dur) {
        var el = $('p' + i);
        el.className = 'pad active';
        beep(i);
        setTimeout(function () {
            el.className = 'pad';
        }, dur);
    }

    function playSequence() {
        accepting = false;
        busy = true;
        var i = 0;
        var iv = setInterval(function () {
            flash(sequence[i], 350);
            i++;
            if (i >= sequence.length) {
                clearInterval(iv);
                setTimeout(function () {
                    accepting = true;
                    busy = false;
                    playerStep = 0;
                    $('msg').innerHTML = 'Your turn';
                }, 500);
            }
        }, 600);
    }

    function nextRound() {
        sequence.push(Math.floor(Math.random() * 4));
        round += 1;
        $('round').innerHTML = String(round);
        $('msg').innerHTML = 'Watch...';
        setTimeout(playSequence, 500);
    }

    function tapPad(i) {
        if (!accepting || busy) { return; }
        flash(i, 200);
        if (sequence[playerStep] !== i) {
            gameOver();
            return;
        }
        playerStep += 1;
        if (playerStep === sequence.length) {
            accepting = false;
            setTimeout(nextRound, 700);
        }
    }

    function gameOver() {
        accepting = false;
        if (round > best) {
            best = round;
            Store.set('simon_best', best);
            $('best').innerHTML = String(best);
        }
        $('msg').innerHTML = 'Game over at round ' + round + ' - tap Start';
    }

    function start() {
        sequence = [];
        round = 0;
        best = Store.get('simon_best', 0);
        $('best').innerHTML = String(best);
        $('round').innerHTML = '0';
        nextRound();
    }

    for (var i = 0; i < 4; i++) {
        (function (idx) {
            onTap($('p' + idx), function () { tapPad(idx); });
        })(i);
    }

    onTap($('startbtn'), function () {
        if (actx && actx.state === 'suspended') { actx.resume(); }
        start();
    });

    best = Store.get('simon_best', 0);
    $('best').innerHTML = String(best);
})();
</script>
</body>
</html>
